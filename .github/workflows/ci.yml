name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests, full pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests dags
      - name: Unit + integration tests (small synthetic run, Spark local mode)
        run: uv run pytest -q
      - name: Full pipeline (11,000 synthetic patients)
        run: uv run omop-etl run
      - name: Upload dashboard and reports
        uses: actions/upload-artifact@v4
        with:
          name: omop-site
          path: |
            data/site
            data/reports

  airflow:
    name: Airflow DAG runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Airflow 3 and the project
        run: |
          uv venv
          uv pip install "apache-airflow>=3.0,<4" -e .
      - name: dag.test() on a small run
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          OMOP_SMALL: "1"
          OMOP_DATA_DIR: ${{ runner.temp }}/omop-data
        run: |
          uv run --no-sync airflow db migrate
          uv run --no-sync airflow dags reserialize
          uv run --no-sync python dags/omop_pipeline.py
          test -f "$OMOP_DATA_DIR/site/index.html"

  pages:
    name: Publish dashboard to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, airflow]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omop-site
          path: out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
      - id: deploy
        uses: actions/deploy-pages@v4
