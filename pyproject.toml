[project]
name = "rosetta-omop"
version = "0.1.0"
description = "Two fictional health systems (Epic Clarity extracts and FHIR R4 bulk export) mapped into one OMOP CDM v5.4 warehouse with PySpark, checked with OHDSI-style data quality rules, and used for a real-world-evidence study."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyspark>=4.0,<5",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "lifelines>=0.30",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]

[project.scripts]
omop-etl = "omop_etl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "moto[s3]>=5", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omop_etl"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are SQL statements and vocabulary/lineage tables: wrapping them hurts readability.
"src/omop_etl/dq/checks.py" = ["E501"]
"src/omop_etl/study/cohort.py" = ["E501"]
"src/omop_etl/site/build.py" = ["E501"]
"src/omop_etl/vocab/demo.py" = ["E501"]
"src/omop_etl/mapping_assist/suggest.py" = ["E501"]
"tests/*" = ["E501"]
